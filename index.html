<!DOCTYPE html>
<html>
<head>
    <title>ARENA Console</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #1a1a2e; color: #eee; }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        h1 { color: #4ecca3; }
        .btn { display: inline-block; padding: 15px 30px; margin: 10px; background: #4ecca3; color: #000; text-decoration: none; border-radius: 5px; }
        .btn:hover { background: #3ab989; }
        .info { background: #16213e; padding: 20px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 ARENA Console</h1>
        <p>Console de Jogos Retro Portátil</p>
        
        <div class="info">
            <h3>Estrutura Criada Automaticamente</h3>
            <ul style="text-align: left;">
                <li>jogos/usuarios/ - Seus jogos aqui</li>
                <li>BIOS/[console]/[regiao]/ - Arquivos de BIOS</li>
                <li>dados/saves/ - Saves automaticos</li>
            </ul>
        </div>
        
        <p style="margin-top: 20px; color: #888;">Version 2.0 - Servidor Local Portátil</p>
    </div>
</body>
</html>
