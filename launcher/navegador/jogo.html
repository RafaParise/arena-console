<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARENA - jogo</title>
<style>
  /* O quadro do jogo ocupa tudo: o RetroArch acompanha o tamanho do canvas
     (ResizeObserver) e estica a imagem do jeito que o ARENA mandou. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Tela do jogo"></canvas>
<script src="jogo.js"></script>
<script src="toque.js"></script>
</body>
</html>
