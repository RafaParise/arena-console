[package]
name = "arena-nativo"
version = "0.1.0"
edition = "2021"
description = "O servidor nativo do ARENA: vai na frente do servidor em Python (docs/MIGRACAO-RUST.md)"
license = "MIT"

# So a biblioteca padrao do Rust: compila sem internet, sem nenhuma dependencia de fora, e cada linha esta aqui
# para quem quiser ler (o codigo do ARENA tambem e' material de aula).
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
